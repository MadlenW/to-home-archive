<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@1,400;1,500&family=Martian+Mono:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #080808;
      color: #fff;
      font-family: 'Martian Mono', monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      cursor: none;
    }
    #cursor {
      position: fixed;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.75);
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: width 0.15s, height 0.15s, opacity 0.3s;
      z-index: 9999;
      will-change: left, top;
    }
    #cursor.grow { width: 26px; height: 26px; background: rgba(255,255,255,0.4); }
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 20px 26px;
      display: flex;
      justify-content: space-between;
      z-index: 300;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    nav.fade { opacity: 0; pointer-events: none; }
    nav a {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      pointer-events: all;
      transition: color 0.2s;
    }
    nav a:hover { color: #fff; }
    #three-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
      transition: opacity 0.5s ease;
    }
    #three-canvas.hidden { opacity: 0; pointer-events: none; }
    #flash {
      position: fixed; inset: 0;
      z-index: 400;
      pointer-events: none;
      opacity: 0;
    }
    #room-world {
      position: fixed; inset: 0;
      z-index: 250;
      display: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      overflow: hidden;
    }
    #room-world.visible { opacity: 1; }
    #room-architecture {
      position: absolute; inset: 0; z-index: 0;
    }
    #arch-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
    }
    #room-nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 20px 26px;
      display: flex;
      align-items: center;
      z-index: 10;
    }
    #room-back {
      font-family: 'Martian Mono', monospace;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.32);
      background: none; border: none;
      cursor: none;
      transition: color 0.2s; padding: 0;
    }
    #room-back:hover { color: rgba(255,255,255,0.82); }
    #room-field {
      position: absolute; inset: 0;
      z-index: 5; overflow: hidden;
    }
    .contrib {
      position: absolute;
      pointer-events: none;
      will-change: transform;
    }
    .contrib svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: visible;
    }
    .contrib-inner {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: 'EB Garamond', serif;
      font-style: italic;
      line-height: 1.3;
      color: rgba(255,255,255,0.82);
      padding: 14px;
      overflow: hidden;
    }
    .contrib-inner img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    #tool-panel {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      padding: 12px 22px 16px;
      background: rgba(5,5,5,0.93);
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex; flex-direction: column; gap: 10px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .tool-row { display: flex; align-items: center; gap: 8px; }
    .swatch {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid transparent; flex-shrink: 0; cursor: none;
      transition: transform 0.15s, border-color 0.15s;
    }
    .swatch:hover { transform: scale(1.3); }
    .swatch.sel { border-color: rgba(255,255,255,0.85); }
    .mat-btn {
      width: 34px; height: 34px; border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.1);
      background: transparent; padding: 0; overflow: hidden;
      cursor: none; flex-shrink: 0; transition: border-color 0.15s;
    }
    .mat-btn:hover { border-color: rgba(255,255,255,0.3); }
    .mat-btn.sel   { border-color: rgba(255,255,255,0.75); }
    .mat-btn canvas { display: block; width: 34px; height: 34px; }
    .size-btn {
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.04);
      cursor: none; flex-shrink: 0;
      transition: border-color 0.15s, background 0.15s;
    }
    .size-btn:hover { border-color: rgba(255,255,255,0.4); }
    .size-btn.sel   { border-color: rgba(255,255,255,0.8); background: rgba(255,255,255,0.12); }
    .sz-sm { width: 13px; height: 13px; }
    .sz-md { width: 20px; height: 20px; }
    .sz-lg { width: 30px; height: 30px; }
    .edge-btn {
      width: 24px; height: 24px;
      border: 1.5px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.04);
      cursor: none; flex-shrink: 0;
      transition: border-color 0.15s, background 0.15s;
    }
    .edge-btn:hover { border-color: rgba(255,255,255,0.4); }
    .edge-btn.sel   { border-color: rgba(255,255,255,0.8); background: rgba(255,255,255,0.12); }
    .ed-sharp     { border-radius: 2px; }
    .ed-soft      { border-radius: 8px; }
    .ed-dissolved { border-radius: 50%; border-style: dashed; }
    .tool-sep { width: 1px; height: 22px; background: rgba(255,255,255,0.07); flex-shrink: 0; }
    #contribution-text {
      flex: 1;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 3px;
      color: rgba(255,255,255,0.8);
      font-family: 'EB Garamond', serif;
      font-style: italic;
      font-size: 15px;
      padding: 7px 11px;
      outline: none; resize: none;
      transition: border-color 0.2s;
    }
    #contribution-text:focus { border-color: rgba(255,255,255,0.25); }
    #contribution-text::placeholder { color: rgba(255,255,255,0.2); }
    #image-upload-btn {
      font-family: 'Martian Mono', monospace;
      font-size: 8px; text-transform: uppercase; letter-spacing: 0.1em;
      color: rgba(255,255,255,0.38); background: transparent;
      border: 1px solid rgba(255,255,255,0.09); border-radius: 3px;
      padding: 8px 12px; cursor: none; flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s;
    }
    #image-upload-btn:hover { border-color: rgba(255,255,255,0.28); color: rgba(255,255,255,0.7); }
    #image-input { display: none; }
    #image-preview {
      font-size: 8px; color: rgba(255,255,255,0.3); letter-spacing: 0.07em;
      max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #submit-btn {
      font-family: 'Martian Mono', monospace;
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em;
      color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 3px;
      padding: 9px 16px; cursor: none; flex-shrink: 0;
      transition: background 0.15s, color 0.15s; white-space: nowrap;
    }
    #submit-btn:hover    { background: rgba(255,255,255,0.10); color: #fff; }
    #submit-btn:disabled { opacity: 0.3; pointer-events: none; }
  </style>
</head>
<body>

<div id="cursor"></div>
<nav id="nav">
  <a href="#">To Home</a>
  <a href="#">About</a>
</nav>

<canvas id="three-canvas"></canvas>
<div id="flash"></div>

<div id="room-world">
  <div id="room-architecture"><canvas id="arch-canvas"></canvas></div>
  <div id="room-nav"><button id="room-back">← back</button></div>
  <div id="room-field"></div>
  <div id="tool-panel">
    <div class="tool-row">
      <div id="swatches" class="tool-row" style="gap:5px;"></div>
      <span style="flex:1"></span>
      <div class="tool-sep"></div>
      <div id="mat-btns" class="tool-row" style="gap:5px;"></div>
    </div>
    <div class="tool-row">
      <div id="size-btns" class="tool-row" style="gap:7px; align-items:center;"></div>
      <div class="tool-sep" style="margin:0 3px;"></div>
      <div id="edge-btns" class="tool-row" style="gap:7px; align-items:center;"></div>
    </div>
    <div class="tool-row" style="gap:9px;">
      <textarea id="contribution-text" rows="2" placeholder="leave something here..."></textarea>
      <input type="file" id="image-input" accept="image/*">
      <button id="image-upload-btn">+ image</button>
      <span id="image-preview"></span>
      <button id="submit-btn">submit</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

const ROOMS = [
  { name:'Kitchen',     slug:'kitchen-_dpxnlj4op8',     channel_id:5244721,
    colors:['#FF4E3A','#E8603C','#FF8C42'], material:'clay'     },
  { name:'Hallway',     slug:'hallway-pmywetfnlve',     channel_id:5244723,
    colors:['#3A4AE8','#6A3AE8','#C4A0E8'], material:'glass'    },
  { name:'Bathroom',    slug:'bathroom-6orcuuzqerc',    channel_id:5244724,
    colors:['#4AE87A','#A8E83A','#3AE8C4'], material:'water'    },
  { name:'Bedroom',     slug:'bedroom-cceaffchfdg',     channel_id:5244726,
    colors:['#F5D842','#E8C43C','#E87A4A'], material:'light'    },
  { name:'Living Room', slug:'living-room-te9ggrtmjzc', channel_id:5244727,
    colors:['#4AC4E8','#42C8E8','#A0D4E8'], material:'membrane' },
];
const SWATCHES  = ['#FF4E3A','#E8603C','#4AE87A','#F5D842','#4AC4E8','#C4A0E8','#E87A4A','#A0D4E8'];
const MATERIALS = ['clay','glass','water','light','membrane'];
const SIZES     = ['small','medium','large'];
const EDGES     = ['sharp','soft','dissolved'];
const API_URL   = 'https://to-home-archive.vercel.app/api/contribute';
const ARENA     = 'https://api.are.na/v2/channels';

let selColor='#FF4E3A', selMaterial='clay', selSize='medium', selEdge='soft';
let activeRoom=null, selImageFile=null, roomOpen=false, hoveredIdx=-1;

/* ── Cursor ── */
const cursorEl=document.getElementById('cursor');
document.addEventListener('mousemove',e=>{
  cursorEl.style.left=e.clientX+'px'; cursorEl.style.top=e.clientY+'px';
});
function hoverable(el){
  el.addEventListener('mouseenter',()=>cursorEl.classList.add('grow'));
  el.addEventListener('mouseleave',()=>cursorEl.classList.remove('grow'));
}
document.querySelectorAll('nav a').forEach(hoverable);

/* ── Helpers ── */
function h2rgb(hex){
  return{r:parseInt(hex.slice(1,3),16)/255,g:parseInt(hex.slice(3,5),16)/255,b:parseInt(hex.slice(5,7),16)/255};
}
function h2v3(hex){const c=h2rgb(hex);return new THREE.Vector3(c.r,c.g,c.b);}
function h2css(hex){const c=h2rgb(hex);return`rgb(${Math.round(c.r*255)},${Math.round(c.g*255)},${Math.round(c.b*255)})`;}

/* ── Three.js ── */
const threeCanvas=document.getElementById('three-canvas');
const renderer=new THREE.WebGLRenderer({canvas:threeCanvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setClearColor(0x080808,1);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,window.innerWidth/window.innerHeight,0.1,100);
camera.position.z=15;
scene.add(new THREE.AmbientLight(0xffeedd,0.35));
const keyL=new THREE.DirectionalLight(0xffffff,0.9);keyL.position.set(6,9,7);scene.add(keyL);
const fillL=new THREE.DirectionalLight(0xaaccff,0.3);fillL.position.set(-7,-4,4);scene.add(fillL);
const rimL=new THREE.DirectionalLight(0xffffff,0.2);rimL.position.set(0,0,-8);scene.add(rimL);

/* ── Shaders ── */
const VERT=`
  uniform float uTime; uniform float uAmp;
  varying vec3 vN; varying vec3 vWP; varying float vRim;
  float h(vec3 p){p=fract(p*vec3(443.9,397.3,491.2));p+=dot(p,p.yxz+19.19);return fract((p.x+p.y)*p.z);}
  float sn(vec3 p){vec3 i=floor(p);vec3 f=fract(p);f=f*f*(3.-2.*f);
    return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),
               mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);}
  void main(){
    vec3 n=normalize(normal); float t=uTime;
    float d=((sn(n*2.2+vec3(t*.28,0.,0.))+sn(n*1.8+vec3(0.,t*.22,.4))+sn(n*2.6+vec3(.6,0.,t*.31)))/3.-.5)*uAmp;
    vec3 dp=n*(1.+d);
    vWP=(modelMatrix*vec4(dp,1.)).xyz;
    vec4 mv=modelViewMatrix*vec4(dp,1.);
    vN=normalize(normalMatrix*normal);
    vRim=1.-abs(dot(normalize(-mv.xyz),vN));
    gl_Position=projectionMatrix*mv;
  }
`;
const FC=`uniform vec3 uC1,uC2;uniform float uCT;varying vec3 vN,vWP;varying float vRim;`;
const FRAGS={
  clay:  FC+`void main(){vec3 c=mix(uC1,uC2,uCT);vec3 L=normalize(vec3(.7,1.,.8));float d=dot(vN,L)*.5+.5;float sp=pow(max(dot(reflect(-L,vN),normalize(-vWP)),.0),12.)*.03;gl_FragColor=vec4(c*(.68+.32*d)+vec3(sp),1.);}`,
  glass: FC+`void main(){vec3 c=mix(uC1,uC2,uCT);vec3 L=normalize(vec3(.5,1.,.7));float fr=pow(vRim,1.5);float sp=pow(max(dot(reflect(-L,vN),normalize(-vWP)),.0),80.)*.95;gl_FragColor=vec4(c*.28+vec3(fr*.7+sp),.10+fr*.78);}`,
  water: FC+`uniform float uTime;void main(){vec3 c=mix(uC1,uC2,uCT);vec3 L=normalize(vec3(.5,1.,.7));float sh=sin(vWP.x*8.+uTime*2.1)*.04;vec3 n2=normalize(vN+vec3(sh,sh,0.));float d=dot(n2,L)*.6+.4;float sp=pow(max(dot(reflect(-L,n2),normalize(-vWP)),.0),50.)*.58;float fr=pow(vRim,2.)*.4;gl_FragColor=vec4(c*d+vec3(sp+fr*.3),.50+fr*.28);}`,
  light: FC+`uniform float uTime;void main(){vec3 c=mix(uC1,uC2,uCT);float g=1.-vRim;float p=.88+sin(uTime*.7)*.12;gl_FragColor=vec4(c*(.8+g*.4)+vec3(g*.1),g*g*.82*p);}`,
  membrane:FC+`uniform float uTime;void main(){vec3 c=mix(uC1,uC2,uCT);vec3 L=normalize(vec3(.5,1.,.7));float d=dot(vN,L)*.55+.45;vec3 aN=normalize(vN+vec3(0.,.3,0.));float an=pow(max(dot(reflect(-L,aN),normalize(-vWP)),.0),22.)*.18;float cr=abs(sin(vWP.y*10.+uTime*.1))*.05;gl_FragColor=vec4(c*d+vec3(an)-vec3(cr),.85-vRim*.2);}`,
};

/* ── Blob cluster definitions ── */
const BLOB_DEFS=[
  // Kitchen – Clay – squat wide 5 lobes
  {centre:[-4.2,-1.6,0],baseScale:1.12,lisAmp:.20,lisSpd:.00021,
   lobes:[{b:[0,0,0],r:.95,da:.18,ds:.0019,dp:0},{b:[.85,-.25,0],r:.60,da:.22,ds:.0023,dp:1.1},
          {b:[-.78,-.2,0],r:.55,da:.20,ds:.0017,dp:2.3},{b:[.15,-.65,0],r:.45,da:.16,ds:.0021,dp:3.7},
          {b:[-.25,.5,0],r:.38,da:.24,ds:.0028,dp:5.1}],mat:'clay'},
  // Hallway – Glass – tall narrow 3 lobes
  {centre:[0.4,2.3,0],baseScale:.90,lisAmp:.15,lisSpd:.00037,
   lobes:[{b:[0,0,0],r:.98,da:.12,ds:.0031,dp:0},{b:[0,.88,0],r:.68,da:.18,ds:.0027,dp:1.8},
          {b:[0,-.65,0],r:.48,da:.14,ds:.0035,dp:3.4}],mat:'glass'},
  // Bathroom – Water – main + orbiting satellites
  {centre:[4.5,-.7,0],baseScale:1.0,lisAmp:.22,lisSpd:.00043,satelliteOrbit:true,
   lobes:[{b:[0,0,0],r:1.0,da:.08,ds:.0015,dp:0},{b:[1.0,.55,0],r:.34,da:.55,ds:.0052,dp:0.8},
          {b:[-.85,.75,0],r:.28,da:.48,ds:.0044,dp:2.1}],mat:'water'},
  // Bedroom – Light – soft amorphous slow pulse
  {centre:[2.2,.7,0],baseScale:1.20,lisAmp:.10,lisSpd:.00013,
   lobes:[{b:[0,0,0],r:1.0,da:.10,ds:.0009,dp:0},{b:[.35,.28,.1],r:.82,da:.12,ds:.0011,dp:2.2},
          {b:[-.28,-.2,-.1],r:.76,da:.11,ds:.0008,dp:4.4}],mat:'light'},
  // Living Room – Membrane – wide horizontal 3 equal lobes
  {centre:[-2.0,1.3,0],baseScale:1.08,lisAmp:.12,lisSpd:.00025,rockH:true,
   lobes:[{b:[0,0,0],r:1.0,da:.16,ds:.0020,dp:0},{b:[.90,.08,0],r:.80,da:.20,ds:.0022,dp:1.6},
          {b:[-.88,-.08,0],r:.76,da:.18,ds:.0019,dp:3.2}],mat:'membrane'},
];

/* ── Build blobs ── */
const blobGroups=[];
ROOMS.forEach((room,ri)=>{
  const def=BLOB_DEFS[ri];
  const frag=FRAGS[def.mat];
  const group=new THREE.Group();
  group.position.set(...def.centre);
  group.userData.blobIndex=ri;
  scene.add(group);
  const lobeMeshes=[],lobeUniforms=[];
  def.lobes.forEach(lobe=>{
    const uniforms={uTime:{value:0},uAmp:{value:.18},uC1:{value:h2v3(room.colors[0])},uC2:{value:h2v3(room.colors[1])},uCT:{value:0}};
    if(def.mat==='water'||def.mat==='light'||def.mat==='membrane') uniforms.uTime={value:0};
    const mat=new THREE.ShaderMaterial({vertexShader:VERT,fragmentShader:frag,uniforms,transparent:true,depthWrite:def.mat==='clay',side:THREE.FrontSide});
    const mesh=new THREE.Mesh(new THREE.SphereGeometry(lobe.r,80,80),mat);
    mesh.position.set(...lobe.b);
    group.add(mesh); lobeMeshes.push(mesh); lobeUniforms.push(uniforms);
  });
  blobGroups.push({group,lobeMeshes,lobeUniforms,def,room,
    lisT:Math.random()*Math.PI*2,colorT:0,colorIdx:0,
    colorSpeed:.0007+Math.random()*.0004,hoverScale:1,blockCount:0,orbitT:Math.random()*Math.PI*2});
});

/* ── Raycasting ── */
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2(-99,-99);
document.addEventListener('mousemove',e=>{
  mouse.x=(e.clientX/window.innerWidth)*2-1;
  mouse.y=-(e.clientY/window.innerHeight)*2+1;
});
threeCanvas.addEventListener('click',()=>{if(!roomOpen&&hoveredIdx>=0)enterRoom(blobGroups[hoveredIdx]);});

/* ── Animate blobs ── */
let clock=0;
function animateBlobs(){
  requestAnimationFrame(animateBlobs);
  clock+=0.016;
  if(!roomOpen){
    const allMeshes=[];
    blobGroups.forEach((bg,i)=>bg.lobeMeshes.forEach(m=>{m.userData.blobIndex=i;allMeshes.push(m);}));
    raycaster.setFromCamera(mouse,camera);
    const hits=raycaster.intersectObjects(allMeshes);
    const newHov=hits.length>0?hits[0].object.userData.blobIndex:-1;
    if(newHov!==hoveredIdx){cursorEl.classList.toggle('grow',newHov>=0);hoveredIdx=newHov;}
  }
  blobGroups.forEach((bg,ri)=>{
    const{def,room,lobeUniforms,lobeMeshes,group}=bg;
    bg.colorT+=bg.colorSpeed;
    if(bg.colorT>=1){bg.colorT=0;bg.colorIdx=(bg.colorIdx+1)%room.colors.length;}
    const c1=h2v3(room.colors[bg.colorIdx]),c2=h2v3(room.colors[(bg.colorIdx+1)%room.colors.length]);
    lobeUniforms.forEach(u=>{u.uTime.value=clock;u.uC1.value=c1;u.uC2.value=c2;u.uCT.value=bg.colorT;});
    def.lobes.forEach((ldef,li)=>{
      const mesh=lobeMeshes[li];
      if(def.satelliteOrbit&&li>0){
        bg.orbitT+=0.0009;
        const ot=bg.orbitT+li*Math.PI;
        mesh.position.x=Math.cos(ot)*1.0;
        mesh.position.y=Math.sin(ot)*.62;
        mesh.position.z=Math.sin(ot*.7)*.2;
      } else {
        const drift=Math.sin(clock*ldef.ds+ldef.dp)*ldef.da;
        const bx=ldef.b[0],by=ldef.b[1],bz=ldef.b[2]||0;
        const len=Math.sqrt(bx*bx+by*by+bz*bz)||1;
        if(len<0.05){mesh.scale.setScalar(1+Math.sin(clock*def.lisSpd*40)*.025);}
        else{mesh.position.x=bx+(bx/len)*drift;mesh.position.y=by+(by/len)*drift;mesh.position.z=bz+(bz/len)*drift;}
      }
    });
    bg.lisT+=def.lisSpd;
    if(def.rockH){
      group.position.x=def.centre[0]+Math.sin(bg.lisT*.85)*.30;
      group.position.y=def.centre[1]+Math.sin(bg.lisT*.40)*.12;
    }else{
      group.position.x=def.centre[0]+Math.sin(bg.lisT*.72)*def.lisAmp;
      group.position.y=def.centre[1]+Math.sin(bg.lisT*.53)*def.lisAmp*.8;
    }
    const tgt=ri===hoveredIdx?1.08:1.0;
    bg.hoverScale+=(tgt-bg.hoverScale)*.08;
    group.scale.setScalar(def.baseScale*(1+Math.min(bg.blockCount*.015,.30))*bg.hoverScale);
  });
  renderer.render(scene,camera);
}

function seededRng(seed){let s=seed|0;return()=>{s=(Math.imul(s,1664525)+1013904223)|0;return(s>>>0)/0x100000000;};}
function hex2rgba(hex,a){const c=h2rgb(hex);return`rgba(${Math.round(c.r*255)},${Math.round(c.g*255)},${Math.round(c.b*255)},${a})`;}

function drawArch(color,t){
  const W=archCanvas.width,H=archCanvas.height;
  archCtx.clearRect(0,0,W,H);
  archCtx.fillStyle='#050505';
  archCtx.fillRect(0,0,W,H);
  const rng=seededRng(42);
  [[8,12,38,55,-4.5,.07],[55,5,40,48,3.2,.06],[2,60,30,35,-2.1,.05],
   [62,52,35,42,5.8,.06],[28,30,44,60,-1.2,.04],[15,72,55,25,2.7,.05]]
  .forEach(([px,py,pw,ph,rot,op],i)=>{
    const x=W*px/100,y=H*py/100,w=W*pw/100,h=H*ph/100;
    const br=1+Math.sin(t*.4+i*1.1)*.008;
    archCtx.save();
    archCtx.translate(x+w/2,y+h/2);
    archCtx.rotate(rot*Math.PI/180);
    archCtx.scale(br,br);
    const v=[[-w/2+rng()*w*.12,-h/2+rng()*h*.08],[w/2-rng()*w*.10,-h/2+rng()*h*.12],
             [w/2-rng()*w*.06,h/2-rng()*h*.09],[-w/2+rng()*w*.14,h/2-rng()*h*.07],
             [-w/2-rng()*w*.04,rng()*h*.1-h*.05]];
    archCtx.beginPath();
    archCtx.moveTo(v[0][0],v[0][1]);
    v.slice(1).forEach(p=>archCtx.lineTo(p[0],p[1]));
    archCtx.closePath();
    archCtx.fillStyle=hex2rgba(color,op*(.8+Math.sin(t*.6+i)*.2));
    archCtx.fill();
    archCtx.strokeStyle=hex2rgba(color,op*2.5*(.5+Math.sin(t*.3+i)*.5));
    archCtx.lineWidth=.5+rng()*1.;
    archCtx.stroke();
    archCtx.restore();
  });
  for(let i=0;i<20;i++){
    const x1=rng()*W,y1=rng()*H,len=40+rng()*240,ang=rng()*Math.PI*2;
    archCtx.strokeStyle=hex2rgba(color,.03+(Math.sin(t*.5+i*.7)+1)/2*.06);
    archCtx.lineWidth=.3+rng()*.8;
    archCtx.beginPath();archCtx.moveTo(x1,y1);
    archCtx.lineTo(x1+Math.cos(ang)*len,y1+Math.sin(ang)*len);
    archCtx.stroke();
  }
  const rng2=seededRng(99);
  for(let i=0;i<320;i++){
    archCtx.beginPath();
    archCtx.arc(rng2()*W,rng2()*H,.5+rng2()*1.8,0,Math.PI*2);
    archCtx.fillStyle=hex2rgba(color,.03+rng2()*.12*(.5+Math.sin(t*.8+i*.3)*.5));
    archCtx.fill();
  }
  archCtx.setLineDash([10,26]);
  for(let g=0;g<6;g++){
    archCtx.strokeStyle=hex2rgba(color,.015+Math.sin(t*.2+g)*.007);
    archCtx.lineWidth=.4;
    archCtx.beginPath();
    archCtx.moveTo(0,H*(.12+g*.16));archCtx.lineTo(W,H*(.12+g*.16));
    archCtx.stroke();
  }
  archCtx.setLineDash([]);
  const vig=archCtx.createRadialGradient(W/2,H/2,H*.08,W/2,H/2,H*.88);
  vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.78)');
  archCtx.fillStyle=vig;archCtx.fillRect(0,0,W,H);
}

function startArch(color){
  archColor=color;
  if(archAF)cancelAnimationFrame(archAF);
  function loop(){archT+=.012;drawArch(archColor,archT);archAF=requestAnimationFrame(loop);}
  loop();
}
function stopArch(){if(archAF){cancelAnimationFrame(archAF);archAF=null;}}

  return m?{color:m[1],material:m[2],size:m[3],edge:m[4]}:null;
}

let _clipIdCounter=0;
function buildContribSVG(sz,mat,col,edge,variant){
  const id='cp'+(_clipIdCounter++);
  const paths=SHAPES[mat]||SHAPES.clay;
  const path=paths[variant%paths.length];
  const fc=h2rgb(col);
  const fr=Math.round(fc.r*255),fg=Math.round(fc.g*255),fb=Math.round(fc.b*255);

  let fillOpacity,strokeOpacity,strokeWidth,extraFX='';
  if(mat==='clay'){
    fillOpacity=0.18;strokeOpacity=0.30;strokeWidth=1.2;
  }else if(mat==='glass'){
    fillOpacity=0.08;strokeOpacity=0.55;strokeWidth=1.0;
    extraFX=`<path d="${path}" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2.5" transform="scale(0.88) translate(6,6)"/>`;
  }else if(mat==='water'){
    fillOpacity=0.16;strokeOpacity=0.40;strokeWidth=1.0;
  }else if(mat==='light'){
    fillOpacity=0.12;strokeOpacity=0.20;strokeWidth=0;
    extraFX=`<path d="${path}" fill="rgba(${fr},${fg},${fb},0.08)" stroke="none" transform="scale(1.12) translate(-6,-6)"/>`;
  }else{
    fillOpacity=0.16;strokeOpacity=0.28;strokeWidth=1.4;
  }

  const blurId=edge==='dissolved'?`filter="url(#bl${id})"`:'';
  const blurDef=edge==='dissolved'
    ?`<filter id="bl${id}"><feGaussianBlur stdDeviation="2.5"/></filter>`:'';

  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible">
  <defs>${blurDef}<clipPath id="${id}"><path d="${path}"/></clipPath></defs>
  ${extraFX}
  <path d="${path}" fill="rgba(${fr},${fg},${fb},${fillOpacity})" stroke="rgba(${fr},${fg},${fb},${strokeOpacity})" stroke-width="${strokeWidth}" ${blurId}/>
  <foreignObject x="0" y="0" width="100" height="100" clip-path="url(#${id})">
    <div xmlns="http://www.w3.org/1999/xhtml" class="contrib-inner" style="font-size:__FONTSIZE__px;"></div>
  </foreignObject>
</svg>`;
}

/* ── Populate room field ── */
const roomField=document.getElementById('room-field');
let contribAF=null,contribT=0;

function populateRoom(bg){
  roomField.innerHTML='';
  const primary=bg.room.colors[0];
  (bg.room._blocks||[]).slice(0,16).forEach((blk,j)=>{
    if(blk.class!=='Text'&&blk.class!=='Image')return;
    const raw=(blk.content||'').replace(/<[^>]*>/g,'').trim();
    const text=raw.replace(/\[col:[^\]]+\]/g,'').trim();
    const meta=parseTag(blk.content||'');
    if(!text&&blk.class!=='Image')return;

    const el=document.createElement('div');
    el.className='contrib';

    const sz={small:88,medium:118,large:152}[meta?.size]||108;
    el.style.width=el.style.height=sz+'px';

    const col=meta?.color||primary;
    const mat=meta?.material||bg.room.material;
    const edge=meta?.edge||'soft';
    const variant=j%3;
    const fontSize=sz<95?10:sz<125?12:14;

    const svgStr=buildContribSVG(sz,mat,col,edge,variant).replace('__FONTSIZE__',fontSize);
    el.innerHTML=svgStr;

    const inner=el.querySelector('.contrib-inner');
    if(inner){
      if(blk.class==='Image'&&blk.image?.original?.url){
        const img=document.createElement('img');
        img.src=blk.image.original.url;
        img.style.cssText='width:100%;height:100%;object-fit:cover;';
        inner.appendChild(img);
      }else{
        inner.textContent=text.split(/\s+/).slice(0,9).join(' ');
      }
    }

    el.style.left=(5+(j*73+29)%82)+'%';
    el.style.top=(8+(j*61+17)%74)+'%';
    el._phase=Math.random()*Math.PI*2;
    roomField.appendChild(el);
  });

  if(contribAF)cancelAnimationFrame(contribAF);
  contribT=0;
  function floatLoop(){
    contribT+=.008;
    roomField.querySelectorAll('.contrib').forEach(el=>{
      const ph=el._phase||0;
      const tx=Math.sin(contribT+ph)*9+Math.sin(contribT*.65+ph+1)*4;
      const ty=Math.cos(contribT*.82+ph)*11+Math.cos(contribT*.48+ph+2)*5;
      const ro=Math.sin(contribT*.38+ph)*.9;
      el.style.transform=`translate(${tx}px,${ty}px) rotate(${ro}deg)`;
    });
    contribAF=requestAnimationFrame(floatLoop);
  }
  floatLoop();
}

function drawMatIcon(ctx,mat,w){
  ctx.clearRect(0,0,w,w);
  if(mat==='clay'){const g=ctx.createRadialGradient(w*.4,w*.38,0,w*.5,w*.5,w*.5);g.addColorStop(0,'#d8a880');g.addColorStop(1,'#6e3a1e');ctx.fillStyle=g;ctx.beginPath();ctx.arc(w/2,w/2,w*.44,0,Math.PI*2);ctx.fill();}
  else if(mat==='glass'){const g=ctx.createRadialGradient(w*.35,w*.32,0,w*.5,w*.5,w*.5);g.addColorStop(0,'rgba(210,235,255,.9)');g.addColorStop(.55,'rgba(90,170,220,.35)');g.addColorStop(1,'rgba(40,90,140,.15)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(w/2,w/2,w*.44,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.65)';ctx.beginPath();ctx.ellipse(w*.37,w*.3,w*.09,w*.045,-.5,0,Math.PI*2);ctx.fill();}
  else if(mat==='water'){const g=ctx.createRadialGradient(w*.4,w*.38,0,w*.5,w*.5,w*.5);g.addColorStop(0,'rgba(110,210,255,.95)');g.addColorStop(1,'rgba(0,70,155,.85)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(w/2,w/2,w*.44,0,Math.PI*2);ctx.fill();}
  else if(mat==='light'){const g=ctx.createRadialGradient(w*.5,w*.5,0,w*.5,w*.5,w*.5);g.addColorStop(0,'rgba(255,255,215,1)');g.addColorStop(.45,'rgba(255,235,160,.6)');g.addColorStop(1,'rgba(255,190,80,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(w/2,w/2,w*.5,0,Math.PI*2);ctx.fill();}
  else{const g=ctx.createRadialGradient(w*.45,w*.42,0,w*.5,w*.5,w*.5);g.addColorStop(0,'rgba(200,220,255,.85)');g.addColorStop(1,'rgba(80,110,180,.4)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(w/2,w/2,w*.44,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=.7;for(let y=4;y<w;y+=5){ctx.beginPath();ctx.moveTo(4,y+Math.sin(y*.4)*1.5);ctx.lineTo(w-4,y+Math.sin(y*.4+2)*1.5);ctx.stroke();}}
}

/* ── Submit ── */
const submitBtn=document.getElementById('submit-btn');
const textInput=document.getElementById('contribution-text');
hoverable(submitBtn);
submitBtn.addEventListener('click',async()=>{
  if(!activeRoom)return;
  const content=textInput.value.trim();
  if(!content&&!selImageFile)return;
  submitBtn.disabled=true;submitBtn.textContent='sending…';
  try{
    let body,headers={};
    if(selImageFile){
      const fd=new FormData();
      fd.append('channel_id',activeRoom.room.channel_id);fd.append('content',content||'');
      fd.append('color',selColor);fd.append('material',selMaterial);fd.append('size',selSize);fd.append('edge',selEdge);fd.append('image',selImageFile);
      body=fd;
    }else{
      headers['Content-Type']='application/json';
      body=JSON.stringify({channel_id:activeRoom.room.channel_id,content,color:selColor,material:selMaterial,size:selSize,edge:selEdge});
    }
    const res=await fetch(API_URL,{method:'POST',headers,body});
    if(res.ok){
      textInput.value='';selImageFile=null;imageInput.value='';imagePreview.textContent='';
      submitBtn.textContent='sent ✓';
      activeRoom.blockCount++;
      if(!activeRoom.room._blocks)activeRoom.room._blocks=[];
      activeRoom.room._blocks.unshift({class:'Text',content:`${content}\n[col:${selColor} mat:${selMaterial} size:${selSize} edge:${selEdge}]`});
      populateRoom(activeRoom);
      setTimeout(()=>{submitBtn.textContent='submit';submitBtn.disabled=false;},2200);
    }else{submitBtn.textContent='error — retry';submitBtn.disabled=false;}
  }catch{submitBtn.textContent='error — retry';submitBtn.disabled=false;}
});
